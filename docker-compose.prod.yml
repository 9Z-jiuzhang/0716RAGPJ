# 云端 / 生产覆盖配置
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml -f docker-compose.prod.yml --env-file .env up -d --build
#
# 要求 .env 中至少设置：
#   DEPLOYMENT_MODE=cloud
#   PUBLIC_BASE_URL=https://你的域名:9080  （或经 LB 对外暴露的业务入口）
#   CORS_ORIGINS=...
#   强随机 SECRET_KEY / JWT_SECRET_KEY / SUPER_ADMIN_PASSWORD / 数据库与 MinIO 密钥
#   Langfuse 自建密钥见 .env.example「Langfuse 自建」段

services:
  api:
    restart: unless-stopped
    # 使用镜像 entrypoint 跑迁移，再以多 worker 启动（无热重载、无源码挂载）
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["--workers", "2"]
    volumes: []
    ports: []
    environment:
      DEPLOYMENT_MODE: cloud
      SEED_DEMO_USERS: "false"
      SUPER_ADMIN_SYNC_PASSWORD: "false"
      AUTH_REGISTER_ENABLED: "false"
      METRICS_PUBLIC: "false"
      CORS_ALLOW_CREDENTIALS: "false"

  web:
    restart: unless-stopped
    ports: []

  postgres:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []
    command:
      - redis-server
      - --port
      - "9637"
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 9637 -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    restart: unless-stopped
    ports: []

  minio:
    restart: unless-stopped
    ports: []

  prometheus:
    restart: unless-stopped
    ports: []

  grafana:
    restart: unless-stopped
    ports: []
    environment:
      GF_SERVER_HTTP_PORT: "9300"
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:?请在 .env 设置 PUBLIC_BASE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请填写}
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_DISABLE_LOGIN_FORM: "false"

  nginx:
    restart: unless-stopped
    ports:
      # 云主机安全组放行 9080（业务统一入口）；TLS 建议在云负载均衡终止
      - "9080:9080"
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # Langfuse UI / Public API（与业务入口分离；安全组放行 9310）
  langfuse-web:
    ports:
      - "9310:9310"

  langfuse-minio:
    ports: []

  langfuse-postgres:
    ports: []

  langfuse-redis:
    ports: []

  langfuse-clickhouse:
    ports: []

  langfuse-worker:
    ports: []
