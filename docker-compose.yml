# AI 知识库 RAG 平台 — Docker Compose 编排
# 端口约定：容器内与宿主机映射均落在 9000–9999（见 docs/CLOUD_DEPLOY.md）

services:
  # ---------- FastAPI 后端 ----------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 本地开发：热重载 + 源码挂载（云端请用 docker-compose.prod.yml 覆盖）
    # 显式 sh 调用，避免 Windows 挂载脚本丢 +x / CRLF shebang 问题
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    command: ["--reload"]
    ports:
      - "9081:9081"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9081/api/v1/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kb-network

  # ---------- 前端静态文件（Nginx） ----------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-kb}-web:local
    restart: unless-stopped
    # 仅供统一入口反代；默认不映射到宿主机
    expose:
      - "9082"
    # 本地：挂载源码便于改前端；启动时 entrypoint 会补齐目录 +x（避免 Windows 解压丢权限白屏）
    # 云端 prod 覆盖为仅用镜像内静态文件（见 docker-compose.prod.yml）
    entrypoint: ["/bin/sh", "/docker-entrypoint-web.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web/docker-entrypoint.sh:/docker-entrypoint-web.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9082/assets/js/router.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_started
    networks:
      - kb-network

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "port=9543"]
    ports:
      - "9543:9543"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      PGPORT: "9543"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 9543"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--port",
        "9637",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "9637:9637"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 9637 -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # ---------- Chroma 向量库 ----------
  chroma:
    # 需与 API 内 chromadb>=1.0 匹配；官方镜像容器内固定监听 8000，宿主机映射到 9800
    image: chromadb/chroma:latest
    ports:
      - "9800:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: "0.0.0.0"
    volumes:
      - ./data/chroma:/chroma/chroma
    healthcheck:
      disable: true
    networks:
      - kb-network

  # ---------- MinIO 对象存储 ----------
  minio:
    image: minio/minio:latest
    ports:
      - "9900:9900"
      - "9901:9901"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    command: server /data --address ":9900" --console-address ":9901"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9900/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kb-network

  # ---------- Prometheus ----------
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=:9909"
    ports:
      - "9909:9909"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - kb-network

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "9300:9300"
    environment:
      GF_SERVER_HTTP_PORT: "9300"
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:9080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请填写}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - kb-network

  # ---------- 统一入口反向代理 ----------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      grafana:
        condition: service_started
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge
